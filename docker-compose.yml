# The platform (NFR-1, AD-27): `docker compose up --build --wait`, then https://localhost:8443.
# The data store alone, for the API tests and the dev backend:  docker compose up -d --wait db
#
# Caddy (proxy) holds the only published web ports, on 127.0.0.1: HTTPS, and HTTP, which only redirects. The backend
# and the frontend are reachable only on the compose network. The mode (HTTPS since FR-24) is the three lines marked
# "mode" below; they change together.
services:
  proxy:
    image: caddy:2.11
    ports:
      # the same host ports as Caddy's, because the redirect and the base URL name them (AD-27)
      - "127.0.0.1:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
      - "127.0.0.1:${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
    environment:
      SITE_ADDRESS: localhost:${HTTPS_PORT:-8443} # mode
      HTTP_PORT: ${HTTP_PORT:-8000}
      # no value: compose passes it from the shell or the env file only when it is set, else the container has none
      # and the Caddyfile's default 3600 applies (an empty value would make `max-age=`) (HT-2)
      HSTS_MAX_AGE:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      # Caddy's admin endpoint, reachable only inside the container; it does not depend on the mode
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BP_DATABASE_URL: postgresql://postgres:booking@db:5432/booking
      BP_HTTPS: "on" # mode
      BP_BASE_URL: https://localhost:${HTTPS_PORT:-8443} # mode
    volumes:
      # the directory, so a fresh clone (no test-switches.toml) starts with every switch off (AD-14)
      - ${SWITCHES_DIR:-./config}:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
    healthcheck:
      # a route that calls no API, so the frontend is healthy without the backend
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/privacy"]
      interval: 2s
      timeout: 3s
      retries: 60

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      # over TCP, so the image's init phase does not count as ready (AD-27)
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "booking"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dbdata:
  caddy_data:
