# The data store (NFR-1). Start it with:  docker compose up -d --wait db
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      # over TCP, so the image's init phase does not count as ready (AD-27)
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "booking"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dbdata:
