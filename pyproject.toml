[project]
name = "booking-platform"
version = "0.1.0"
description = "Sauna booking platform (Python backend, managed with uv)"
readme = "README.md"
authors = [
    { name = "Lisa Larsen", email = "lisa.k.larsen@himolde.no" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
booking-platform = "booking_platform:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
